version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native port) no longer ships the JavaScript compiler API that the
      # declaration build and TypeDoc rely on, so TypeScript majors are adopted deliberately rather
      # than by an automated pull request.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # ESLint 10 removes the context API that eslint-plugin-react 7 still calls (its
      # `react/display-name` rule fails to load), so ESLint majors wait for the plugin to catch up.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # size-limit 14 bundles with rolldown, which cannot read the CSS entries the size budgets
      # measure, so size-limit majors wait until those budgets are reworked.
      - dependency-name: size-limit
        update-types: ['version-update:semver-major']
      - dependency-name: '@size-limit/*'
        update-types: ['version-update:semver-major']
      # Node type definitions track the Node version the repo runs, so that code cannot use APIs
      # the runtime does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
