name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please check existing issues first. Security problems go to a private advisory (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal code sample, or a StackBlitz / CodeSandbox link. For paste or sanitization problems, include the input HTML.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: React, react-hook-form (for react-rtekit-rhf), bundler / framework, browser and OS.
      placeholder: 'React 19.3, react-hook-form 7.88, Vite 7, Chrome 140 on macOS'
    validations:
      required: true
