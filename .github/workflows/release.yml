name: Release

on:
  push:
    branches: [main]
  # Run it by hand once the NPM_TOKEN secret is added, to publish without a new commit.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    env:
      # Read by the publish expression below; see the note there.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # With no changesets pending, the action publishes whatever version is not yet on
      # npm. Without a token that fails on every push to main, so publishing waits until
      # the NPM_TOKEN secret exists; until then this step only opens version PRs.
      # Secrets cannot be tested directly in an expression, hence the job-level env.
      - name: Create a version PR, or publish when one is merged
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ env.NPM_TOKEN != '' && 'pnpm release' || '' }}
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  deploy-site:
    name: Deploy the docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the site for its Pages sub-path
        run: pnpm build:site
        env:
          # A project Pages site is served from /<repo>/; without this every asset URL
          # and every route is wrong by exactly that prefix.
          SITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
