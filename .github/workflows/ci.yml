name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # lint -> typecheck -> test -> build -> size, in one job so later steps reuse the build.
  verify:
    name: Lint, typecheck, test, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size
      - name: Package linting on the real tarball
        run: pnpm publint && pnpm attw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # A dedicated job so a sanitizer regression is unmistakable in the checks list.
  security:
    name: Security (XSS corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: XSS corpus and sanitizer fuzzing
        run: pnpm vitest run --project core packages/react-rtekit/test/security
      - name: Audit production dependencies
        run: pnpm audit --prod

  docs:
    name: API docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:json
      - name: Fail on any undocumented public symbol
        run: pnpm docs:check

  conformance:
    name: Docs standard conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The nav, title and URL-map invariants
        run: pnpm content:validate
      - name: Recompile the content and the generated reference
        run: pnpm docs:json && pnpm content:reference && pnpm content
      - name: Fail if the generated reference or the content drifted
        run: git diff --exit-code -- content apps/site/src/content apps/site/public
      - name: The 26 PPDS conformance checks
        run: pnpm conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: qa/conformance-report.md

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Verify every redirect in a browser
        run: pnpm --filter @react-rtekit/site preview & sleep 6 && pnpm redirects:check
      - name: The machine surface returns its own content type
        run: pnpm conformance:served
      - name: Run Playwright
        # PRs run Chromium only; main runs all three engines plus mobile emulation.
        run: pnpm e2e
        env:
          FULL_MATRIX: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/site/playwright-report/
          retention-days: 7

  # A job of its own: a timing budget measured on a machine that is also running eight
  # browsers measures the machine (09 §4).
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Typing latency, mount time and paste cost
        run: pnpm --filter @react-rtekit/site e2e:perf

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
