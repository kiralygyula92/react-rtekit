name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, so the token cannot either. Without this every
# job ran with the repository's default token, which is read-write on older repositories
# — including the PR jobs that build and run code from the branch.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # build -> lint -> typecheck -> test -> size, in one job so later steps reuse the build.
  # The build comes first: the site imports `react-rtekit` through the package's built
  # declarations, so linting it before they exist types every editor value as `any`.
  verify:
    name: Lint, typecheck, test, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm size
      - name: Package linting on the real tarball
        run: pnpm publint && pnpm attw
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # A dedicated job so a sanitizer regression is unmistakable in the checks list.
  security:
    name: Security (XSS corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: XSS corpus and sanitizer fuzzing
        # `core` for the sanitizer and parser; `react` for the boundaries that need a
        # mounted editor (the `*.dom.test.tsx` files).
        run: pnpm vitest run --project core --project react packages/react-rtekit/test/security
      - name: Audit production dependencies
        run: pnpm audit --prod

  docs:
    name: API docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:json
      - name: Fail on any undocumented public symbol
        run: pnpm docs:check

  content:
    name: Docs content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The prose
        run: pnpm copy:check
      - name: Recompile the content and the generated reference, and check it
        run: pnpm docs:json && pnpm content:reference && pnpm content
      - name: Fail if the generated reference or the content drifted
        run: git diff --exit-code -- content apps/site/src/content apps/site/public apps/site/vercel.json

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        # Playwright is a dependency of the site, not of the workspace root.
        run: pnpm --filter @react-rtekit/site exec playwright install --with-deps
      - name: Run Playwright
        # PRs run Chromium only; main runs all three engines plus mobile emulation.
        # Playwright builds the site and serves it on :4189 itself.
        run: pnpm e2e
        env:
          FULL_MATRIX: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
      # After Playwright, not before: the preview this starts is left running, and it
      # would hold the port Playwright's own server needs.
      - name: Verify every redirect in a browser
        run: pnpm --filter @react-rtekit/site preview & sleep 6 && pnpm redirects:check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/site/playwright-report/
          retention-days: 7

  # A job of its own: a timing budget measured on a machine that is also running eight
  # browsers measures the machine.
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @react-rtekit/site exec playwright install --with-deps chromium
      - name: Typing latency, mount time and paste cost
        run: pnpm --filter @react-rtekit/site e2e:perf

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
